<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>محصول فاخر | لوحة التشغيل</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/system.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <section id="loginScreen">
      <form id="loginForm" class="login-card">
        <img class="logo" src="assets/logo.png" alt="Luxury Crop" /><span
          class="eyebrow"
          >THE OTHER SIDE OF THE COUNTER</span
        >
        <h1>أهلًا، خلف البار.</h1>
        <p class="muted">كل تفاصيل يومك، في مكان واحد.</p>
        <label class="field"
          >كلمة مرور الإدارة<input
            id="password"
            class="input"
            type="password"
            autocomplete="current-password"
            required
            minlength="12" /></label
        ><button class="btn red full" type="submit">دخول لوحة التشغيل</button>
        <p id="loginError" class="error" role="alert"></p>
        <a href="./" class="muted">العودة للمنيو ↗</a>
      </form>
    </section>
    <div id="dashboard" hidden>
      <aside id="sidebar">
        <a href="./"
          ><img src="assets/logo.png" class="logo" alt="Luxury Crop" /></a
        ><span class="sidebar-label">مساحة الإدارة</span>
        <nav id="ownerNav">
          <button data-page="home" class="on"><span>01</span> نظرة عامة</button
          ><button data-page="orders">
            <span>02</span> الطلبات <b id="newCount"></b></button
          ><button data-page="menu"><span>03</span> المنيو والأصناف</button
          ><button data-page="customers"><span>04</span> العملاء والولاء</button
          ><button data-page="reviews"><span>05</span> آراء العملاء</button
          ><button data-page="settings">
            <span>06</span> الإعدادات والعروض
          </button>
        </nav>
        <div class="sidebar-bottom">
          <a class="btn outline full" href="./" target="_blank" rel="noopener"
            >افتح منيو العميل ↗</a
          ><button id="logout" class="btn secondary full">تسجيل الخروج</button>
        </div>
      </aside>
      <div id="ownerMain">
        <header class="owner-header">
          <div class="row">
            <button class="icon-btn" id="sidebarToggle" aria-label="القائمة">
              ☰
            </button>
            <div>
              <h1 id="pageTitle">نظرة عامة</h1>
              <p id="pageSubtitle" class="muted">
                التفاصيل اللي تساعدك تاخذ قرار.
              </p>
            </div>
          </div>
          <div class="row">
            <span id="syncStatus" class="sync"
              ><i class="alert-dot"></i> متصل</span
            ><select id="period" class="input">
              <option value="1">آخر ٢٤ ساعة</option>
              <option value="7">آخر ٧ أيام</option>
              <option value="30" selected>آخر ٣٠ يوم</option>
              <option value="90">آخر ٩٠ يوم</option></select
            ><button class="icon-btn" id="refresh" aria-label="تحديث">↻</button>
          </div>
        </header>
        <main id="ownerContent"></main>
      </div>
    </div>
    <dialog id="dialog" aria-label="إدارة الصنف أو الطلب"></dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
