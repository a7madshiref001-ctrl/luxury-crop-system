<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="assets/canonical.js?v=20"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>محصول فاخر · دخول الموظفين</title>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/logo-mark.png">
<link rel="stylesheet" href="assets/darj.css?v=20">
<link rel="stylesheet" href="assets/brand.css?v=20">
<style>
  body{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  .hub{width:min(560px,100%);display:grid;gap:14px}
  .hub__h{display:grid;justify-items:center;gap:10px;text-align:center;margin-bottom:6px}
  .hub__h img{width:64px;height:64px}
  .hub__h b{font-size:20px}
  .hub__h p{color:var(--muted)}
  .go{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s;text-align:start;width:100%}
  .go:hover{border-color:var(--ink);transform:translateY(-2px)}
  .go .dev__i{width:46px;height:46px;border-radius:14px;background:var(--paper);display:grid;place-items:center}
  .go .bi>b{font-size:17px}
  .go .bi>small{font-size:13px}
  .go .ico:last-child{margin-inline-start:auto;color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
  .foot a{font-family:var(--f-en)}
</style>
<script src="assets/pwa.js?v=20" defer></script>
</head>
<body>
<div class="hub" id="hub" hidden></div>
<script src="assets/config.js?v=20"></script>
<script src="assets/menu.js?v=20"></script>
<script src="assets/darj.js?v=20"></script>
<script>
  window.DARJ_ROLE = 'gate';
</script>
<script src="assets/link.js?v=20"></script>
<script src="assets/gate.js?v=20"></script>
<script>
/* صفحة واحدة يدخل منها الكل: كل موظف يختار اسمه ويكتب رقمه، والنظام يفتح له شاشته حسب وظيفته.
   كاشير / مدير / مشرف ← الكاشير · باريستا ← شاشة الباريستا · شيف ← شاشة المطبخ */
(function () {
  var D = window.DARJ, G = window.DARJ_GATE;
  var bi = function (en, ar) { return '<span class="bi"><b>' + en + '</b><small>' + ar + '</small></span>'; };
  var foot = '<div class="gate__links"><small>شاشات العملاء (بدون دخول)</small>'
    + '<a class="btn btn--ghost btn--sm" href="kiosk.html">' + D.icon('kiosk', 'sm') + bi('Kiosk', 'كشك الطلب') + '</a>'
    + '<a class="btn btn--ghost btn--sm" href="screen.html?mode=cart">' + D.icon('user', 'sm') + bi('Customer display', 'شاشة العميل') + '</a>'
    + '<a class="btn btn--ghost btn--sm" href="screen.html">' + D.icon('tv', 'sm') + bi('Order status', 'حالة الطلبات') + '</a></div>';
  function ask() {
    document.getElementById('hub').hidden = true;
    G.open({ where: 'صفحة الدخول', brand: 'Staff', label: 'Staff sign-in', title: "Who's<br>working?", foot: foot,
      sub: 'اختر اسمك واكتب رقمك الخاص. النظام يفتح لك شاشتك حسب وظيفتك، وكل ما تفعله يُسجَّل باسمك.' }).then(route);
  }
  function route(u) {
    var st = (D.PREP_ROLES || {})[u.role];
    if (st) { location.href = 'kds.html?st=' + st; return; }
    if (!D.SAT) { location.href = 'app.html'; return; }
    // جهاز مربوط بالكاشير (شاشة تحضير): المدير أو الكاشير يختار الشاشة اللي عايز يتابعها
    var hub = document.getElementById('hub');
    var go = function (href, ic, en, ar) { return '<a class="go" href="' + href + '"><span class="dev__i">' + D.icon(ic) + '</span>' + bi(en, ar) + D.icon('chev') + '</a>'; };
    hub.innerHTML = '<div class="hub__h"><img src="assets/brand/logo-mark.png" alt=""><b>' + D.esc(u.name) + '</b><p>' + D.esc((D.ROLES[u.role] || {}).ar || '') + ' · هذا الجهاز شاشة تحضير مربوطة بالكاشير</p></div>'
      + go('kds.html?st=bar', 'cup', 'Barista', 'شاشة الباريستا — المشروبات') + go('kds.html?st=kitchen', 'flame', 'Kitchen', 'شاشة المطبخ — الطعام والحلا')
      + '<button class="go" id="swap"><span class="dev__i">' + D.icon('users') + '</span>' + bi('Switch user', 'دخول موظف آخر') + D.icon('chev') + '</button>'
      + '<p class="foot"><span lang="en">Built by ATHR</span></p>';
    hub.hidden = false;
    document.getElementById('swap').addEventListener('click', function () { G.out('صفحة الدخول'); ask(); });
  }
  ask();
})();
</script>
</body>
</html>
