<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="assets/canonical.js?v=5"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>محصول فاخر · التحضير</title>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/logo-mark.png">

<link rel="stylesheet" href="assets/darj.css?v=5">
<link rel="stylesheet" href="assets/brand.css?v=5">
<style>
  body{min-height:100dvh}
  .kbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .kbar__t{display:grid;line-height:1.1}
  .kbar__t b{font-family:var(--f-en);font-weight:700;font-size:22px;letter-spacing:-.02em;direction:ltr;text-align:right}
  .kbar__t small{font-size:12px;color:var(--muted);font-weight:700}
  .kbar__sp{flex:1}
  .kstat{display:grid;line-height:1.15;text-align:center;padding:0 12px;border-inline-start:1px solid var(--line)}
  .kstat b{font-family:var(--f-en);font-size:20px;font-weight:700}
  .kstat small{font-size:11px;color:var(--muted)}
  .clock{font-family:var(--f-en);font-weight:700;font-size:22px;direction:ltr}
  .kst button{display:inline-flex;align-items:center;gap:6px}
  .kst .ico{width:15px;height:15px}
  @media (max-width:900px){.kstat{display:none}}
  @media (max-width:640px){.clock{display:none}.lnk span{display:none}.lnk{width:30px;padding:0;justify-content:center}}
</style>
<script src="assets/pwa.js?v=5" defer></script>
</head>
<body>
<header class="kbar">
  <a href="index.html" id="brand"></a>
  <span class="kbar__t"><span class="label" id="kL">Barista · KDS</span><b id="kT">Barista</b></span>
  <div class="seg kst" id="kst"></div>
  <span class="kbar__sp"></span>
  <span class="kstat"><b id="sOpen">0</b><small>في الطابور</small></span>
  <span class="kstat"><b id="sAvg">0:00</b><small>متوسط التحضير</small></span>
  <span class="kstat"><b id="sDone">0</b><small>سُلّم اليوم</small></span>
  <span id="lnk"></span>
  <div class="seg" id="lang"><button data-l="ar">ع</button><button data-l="en" class="on">EN</button></div>
  <button class="icon-btn" id="snd" title="الصوت"></button>
  <span class="clock" id="clk"></span>
</header>
<main id="k"></main>
<script src="assets/config.js?v=5"></script>
<script src="assets/menu.js?v=5"></script>
<script src="assets/darj.js?v=5"></script>
<script src="assets/kds.js?v=5"></script>
<script>
  window.DARJ_ROLE = 'kds';
</script>
<script src="assets/link.js?v=5"></script>
<script>
(function () {
  const D = window.DARJ;
  const L = window.DARJ_LINK;
  const q = new URLSearchParams(location.search);
  let st = ['bar', 'kitchen'].includes(q.get('st')) ? q.get('st') : 'bar';
  D.startLive();
  document.getElementById('brand').innerHTML = D.brand('KDS');
  const k = window.DARJ_KDS.mount(document.getElementById('k'), { lang: 'en', st });
  const kst = document.getElementById('kst');
  function head() {
    const S = D.STATIONS[st];
    document.getElementById('kT').textContent = S.en;
    document.getElementById('kL').textContent = (st === 'bar' ? 'Bar' : 'Kitchen') + ' · KDS · ' + S.ar;
    document.title = `${D.STORE.nameAr || ''} · ${S.ar}`;
    kst.innerHTML = Object.entries(D.STATIONS).map(([id, x]) => `<button data-st="${id}" class="${id === st ? 'on' : ''}">${D.icon(x.ic)} ${x.en}</button>`).join('');
    L.track({ st, name: S.ar });
  }
  kst.addEventListener('click', (e) => { const b = e.target.closest('[data-st]'); if (!b || b.dataset.st === st) return; st = b.dataset.st; history.replaceState(null, '', '?st=' + st); k.setSt(st); head(); stats(); });
  head();
  const lang = document.getElementById('lang');
  lang.addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (!b) return; lang.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); k.setLang(b.dataset.l); });
  const snd = document.getElementById('snd');
  const paintSnd = () => { snd.innerHTML = D.icon(D.devMute() ? 'x' : 'volume'); };
  snd.addEventListener('click', () => { D.devMute(!D.devMute()); paintSnd(); });
  function stats() {
    const t = D.kdsStats(D.state(), st);
    document.getElementById('sOpen').textContent = t.open;
    document.getElementById('sAvg').textContent = D.mmss(t.avg);
    document.getElementById('sDone').textContent = t.done;
    document.getElementById('clk').textContent = D.time(Date.now(), true);
  }
  const lnk = () => { document.getElementById('lnk').innerHTML = L.pill(); };
  L.on(lnk); lnk();
  D.on(stats); setInterval(stats, 5000); stats(); paintSnd();
})();
</script>
</body>
</html>
