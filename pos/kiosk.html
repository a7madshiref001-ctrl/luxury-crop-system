<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="assets/canonical.js?v=6"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>محصول فاخر · اطلب من هنا</title>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/logo-mark.png">

<link rel="stylesheet" href="assets/darj.css?v=6">
<link rel="stylesheet" href="assets/brand.css?v=6">
<style>
  html,body{height:100%}
  body{overflow:hidden;background:var(--paper);-webkit-user-select:none;user-select:none;touch-action:manipulation}
  input{-webkit-user-select:text;user-select:text}
  #kx{height:100dvh}
  .bi{display:inline-grid;line-height:1.2}
  /* ---------- hello ---------- */
  .kh{height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .kh__l{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:clamp(24px,5vw,72px);min-width:0}
  .kh__brand .brand__mark{width:44px;height:44px}
  .kh__brand .brand__word{font-size:22px}
  .kh h1{font-family:var(--f-en);font-weight:700;font-size:clamp(50px,7.6vw,108px);letter-spacing:-.05em;line-height:.92;direction:ltr;text-align:right}
  .kh p{font-size:clamp(15px,1.6vw,19px);color:var(--ink-2);max-width:42ch;line-height:1.8}
  .kh__go{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;max-width:620px}
  .kh__opt{display:grid;gap:16px;justify-items:start;padding:24px 22px;border-radius:26px;background:var(--card);border:1.5px solid var(--line);transition:transform .15s var(--ease),border-color .15s}
  .kh__opt:active{transform:scale(.97)}
  .kh__opt .ico{width:34px;height:34px}
  .kh__opt .bi>b{font-family:var(--f-en);font-size:clamp(20px,2.2vw,26px);letter-spacing:-.02em}
  .kh__opt .bi>small{font-size:14px;color:var(--muted)}
  .kh__opt:first-child{background:var(--ink);border-color:var(--ink);color:#fff}
  .kh__opt:first-child .bi>small{color:rgba(255,255,255,.7)}
  .kh__opt:first-child .ico{color:var(--brand,#7FE0B0)}
  .kh__foot{display:flex;gap:10px;align-items:center;margin-top:6px}
  .kh__r{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:var(--paper-2);min-height:0}
  .kh__pic{border-radius:24px;background:#fff center/cover;min-height:0}
  .kh__pic--0{grid-row:span 2}
  .kh__pic--5{display:none}
  @media (max-width:860px){
    .kh{grid-template-columns:1fr;grid-template-rows:30vh minmax(0,1fr)}
    .kh__r{order:-1;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
    .kh__pic--0{grid-row:auto}.kh__pic--3,.kh__pic--4{display:none}
    .kh__l{justify-content:flex-start;padding-top:28px}
  }
  @media (max-width:520px){.kh__go{grid-template-columns:1fr}.kh__opt{grid-template-columns:auto 1fr;align-items:center}}
  /* ---------- menu ---------- */
  .km{height:100%;display:grid;grid-template-columns:128px minmax(0,1fr) 350px;grid-template-rows:auto minmax(0,1fr)}
  .km__top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
  .km__top .seg button{display:inline-flex;align-items:center;gap:6px;height:38px;font-size:13.5px}
  .km__sp{flex:1}
  .km__cats{overflow-y:auto;padding:12px 10px 24px;display:grid;gap:6px;align-content:start;background:var(--card);border-inline-end:1px solid var(--line);scrollbar-width:none}
  .km__cats button{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;text-align:center;color:var(--ink-2);transition:background .15s,color .15s}
  .km__cats button .ico{width:24px;height:24px}
  .km__cats button.on{background:var(--ink);color:#fff}
  .km__cats button.on .ico{color:var(--brand,#7FE0B0)}
  .km__cats .bi{justify-items:center;text-align:center}
  .km__cats .bi b{font-size:12.5px;font-family:var(--f-en)}
  .km__cats .bi small{font-size:11px;opacity:.75}
  .km__grid{overflow-y:auto;padding:18px 20px 120px;min-width:0}
  .km__h h2{font-size:28px;font-weight:700;line-height:1.2}
  .km__items{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-top:14px}
  .kp{display:grid;grid-template-rows:auto 1fr auto;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:start;transition:transform .15s var(--ease)}
  .kp:active{transform:scale(.97)}
  .kp__img{position:relative;aspect-ratio:1/1;background:#fff center/cover}
  .kp__n{position:absolute;top:10px;inset-inline-start:10px;min-width:32px;height:32px;padding:0 8px;border-radius:999px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--f-en);font-weight:700;display:grid;place-items:center}
  .kp__off{position:absolute;inset:auto 10px 10px;padding:4px 10px;border-radius:999px;background:var(--card);font-style:normal;font-size:12px;font-weight:700;text-align:center}
  .kp.off{opacity:.55}
  .kp__b{padding:12px 14px 2px;min-width:0}
  .kp__b b{display:block;font-size:16px;line-height:1.35}
  .kp__b small{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kp__p{padding:6px 14px 14px;font-size:17px;display:flex;gap:8px;align-items:baseline}
  .kp__p s{color:var(--muted);font-size:13px;font-family:var(--f-en)}
  .km__cart{background:var(--card);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .kc__empty{flex:1;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;color:var(--muted);padding:24px}
  .kc__empty .ico{width:40px;height:40px}
  .kc__h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
  .kc__h .bi b{font-family:var(--f-en);font-size:20px}
  .kc__h .muted{margin-inline-start:auto;font-size:13px}
  .kc__x{display:none}
  .kc__lines{flex:1;overflow-y:auto;padding:0 16px}
  .kc__l{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .kc__img{width:52px;height:52px;border-radius:14px;background:var(--paper) center/cover}
  .kc__n{min-width:0}
  .kc__n b{display:block;font-size:14.5px}
  .kc__n small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kc__p{font-family:var(--f-en);font-weight:700}
  .kc__q{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:var(--paper);border-radius:999px;padding:3px}
  .kc__q button{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
  .kc__q span{min-width:26px;text-align:center;font-family:var(--f-en);font-weight:700}
  .kc__q.lg{margin:0}
  .kc__q.lg button{width:50px;height:50px}
  .kc__q.lg span{min-width:36px;font-size:20px}
  .kc__f{padding:14px 16px 18px;border-top:1px solid var(--line);display:grid;gap:12px}
  .kc__tot{display:flex;justify-content:space-between;align-items:center;font-size:24px}
  .kc__tot .bi b{font-family:var(--f-en);font-size:18px}
  .kc__off{display:flex;gap:8px;align-items:center;padding:12px;border-radius:14px;background:var(--amber-50);color:var(--amber);font-size:13px;font-weight:700}
  .km__bar{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:14px;height:64px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);white-space:nowrap}
  .km__bar .bi small{color:rgba(255,255,255,.7)}
  .km__bar .cur{color:rgba(255,255,255,.7)}
  .km__t{font-size:18px}
  .km__n{min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--brand,var(--go));display:grid;place-items:center;font-family:var(--f-en);font-weight:700}
  .km__bar.pop{animation:kpop .45s var(--ease)}
  @keyframes kpop{40%{transform:translateX(-50%) scale(1.06)}}
  @media (max-width:1100px){
    .km{grid-template-columns:112px minmax(0,1fr)}
    .km__cart{position:fixed;z-index:40;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);box-shadow:0 0 0 100vmax rgba(20,20,20,.4);display:none}
    .km.cart-open .km__cart{display:flex}
    .kc__x{display:grid}
    .km__bar:not([hidden]){display:flex}
    .km.cart-open .km__bar{display:none}
  }
  @media (max-width:700px){
    .km{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
    .km__top{flex-wrap:wrap;padding:10px 12px}
    .km__top .brand__word,.km__top .brand__ar,.km__top .btn .bi small{display:none}
    .km__cats{display:flex;overflow-x:auto;padding:8px 10px;border:0;border-bottom:1px solid var(--line)}
    .km__cats button{flex:none;grid-auto-flow:column;padding:8px 12px;border-radius:999px}
    .km__cats .bi small{display:none}
    .km__items{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .km__grid{padding:14px 12px 110px}
  }
  /* ---------- pay ---------- */
  .kpay{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .kpay__in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:24px;overflow-y:auto;max-width:1100px;width:100%;margin:0 auto;align-items:start}
  .kpay__sum{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;display:grid;gap:6px}
  .kpay__l{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
  .kpay__l b{font-family:var(--f-en)}
  .kpay__l small{display:block;font-size:12px;color:var(--muted)}
  .kpay__l>span:last-child{font-family:var(--f-en);font-weight:700}
  .kpay__tot{display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700;padding:10px 0 14px}
  .kpay__tot .bi b{font-family:var(--f-en);font-size:18px}
  .kpay__how{display:grid;gap:14px}
  .kpay__how h2{font-size:32px;line-height:1.2}
  .kpay__opt{display:grid;gap:10px;justify-items:start;padding:22px;border-radius:24px;background:var(--card);border:1.5px solid var(--line);text-align:start;transition:transform .15s var(--ease)}
  .kpay__opt:active{transform:scale(.98)}
  .kpay__opt:first-of-type{border-color:var(--ink);box-shadow:0 0 0 4px rgba(20,20,20,.06)}
  .kpay__opt .bi b{font-family:var(--f-en);font-size:22px}
  .kpay__opt .bi small{font-size:14px;color:var(--ink-2)}
  .kpay__opt>small{color:var(--muted);font-size:12.5px}
  .kpay__ic{display:flex;gap:8px;align-items:center}
  .kpay__ic span{width:54px}
  .kpay__ic .ico{width:34px;height:34px}
  @media (max-width:800px){.kpay__in{grid-template-columns:1fr;padding:14px}}
  /* ---------- messages / done ---------- */
  .kmsg,.kdone{height:100%;display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:24px}
  .kmsg h2{font-size:clamp(24px,3.4vw,40px);line-height:1.25;max-width:24ch}
  .kmsg p{color:var(--muted)}
  .kmsg>.ico{width:56px;height:56px;color:var(--red)}
  .kspin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:kspin 1s linear infinite}
  @keyframes kspin{to{transform:rotate(360deg)}}
  .kdone__no{display:grid;justify-items:center;line-height:1}
  .kdone__no small{font-size:16px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .kdone__no b{font-family:var(--f-en);font-size:clamp(110px,17vw,210px);font-weight:700;letter-spacing:-.06em;direction:ltr}
  .kdone h2{font-size:clamp(20px,2.6vw,30px);max-width:28ch;line-height:1.4}
  .kdone p{color:var(--ink-2);font-size:16px}
  .kdone__steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
  .kdone__steps>span{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .kdone__steps span .bi b{font-size:12.5px;font-family:var(--f-en)}
  .kdone__steps span .bi small{font-size:10.5px}
  .kdone__steps>span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .kdone__steps i{width:20px;height:2px;background:var(--line)}
  @media (max-width:600px){.kdone__steps i{display:none}}
  /* ---------- item sheet ---------- */
  .ksheet{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.45);display:grid;place-items:center;padding:20px;animation:kfade .2s}
  .ksheet.out{opacity:0;transition:opacity .2s}
  @keyframes kfade{from{opacity:0}}
  .ksheet__in{position:relative;width:min(780px,100%);max-height:calc(100dvh - 40px);background:var(--card);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1fr) auto}
  .ksheet__img{background:#fff center/cover;min-height:300px}
  .ksheet__b{padding:26px 24px;overflow-y:auto}
  .ksheet__b h2{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px}
  .ksheet__b p{color:var(--ink-2);margin-top:6px}
  .ksheet__g{margin-top:20px}
  .ksheet__gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .ksheet__gh .bi b{font-family:var(--f-en)}
  .ksheet__gh small{font-size:12px;color:var(--muted)}
  .ksheet__opts{display:flex;flex-wrap:wrap;gap:8px}
  .ko{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:8px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;text-align:start}
  .ko.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .ko small{opacity:.7;font-family:var(--f-en)}
  .ksheet__f{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
  .ksheet__f .btn{flex:1;max-width:440px}
  .ksheet__x{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:var(--card);width:44px;height:44px;border-radius:50%;box-shadow:var(--shadow)}
  @media (max-width:700px){
    .ksheet{padding:0;place-items:end stretch}
    .ksheet__in{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;border-radius:28px 28px 0 0;max-height:94dvh}
    .ksheet__img{min-height:190px;max-height:28vh}
    .ksheet__b{padding:18px 16px}
    .ksheet__f{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
    .ksheet__f .btn .bi small{display:none}
  }
  .kidle{position:fixed;inset:0;z-index:60;background:rgba(20,20,20,.5);display:grid;place-items:center}
  .kidle__in{background:var(--card);border-radius:28px;padding:32px;text-align:center;display:grid;gap:12px;width:min(420px,calc(100% - 32px))}
  .kidle__in h2{font-size:30px}
</style>
<script src="assets/pwa.js?v=6" defer></script>
</head>
<body>
<div id="kx"></div>
<script src="assets/config.js?v=6"></script>
<script src="assets/menu.js?v=6"></script>
<script src="assets/darj.js?v=6"></script>
<script>
  window.DARJ_ROLE = 'kiosk';
</script>
<script src="assets/link.js?v=6"></script>
<script>
  window.DARJ.startLive();
</script>
<script src="assets/kiosk.js?v=6"></script>
</body>
</html>
